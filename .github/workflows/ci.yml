name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make \
            fakeroot \
            dpkg-dev \
            gjs \
            ibus \
            gir1.2-ibus-1.0 \
            gir1.2-gtk-3.0 \
            libglib2.0-bin \
            desktop-file-utils \
            appstream \
            dbus-x11 \
            xvfb

      - name: Build project
        run: make all

      - name: Build Debian package
        run: make package

      - name: Run test suites (headless with IBus daemon)
        run: |
          xvfb-run -a dbus-run-session bash -c "ibus-daemon -drx && make test"

      - name: Inspect built Debian package
        run: |
          ./tests/packaging/test-package.sh
          dpkg-deb -I avro-linux_*.deb
          dpkg-deb -c avro-linux_*.deb

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-24.04'
        with:
          name: avro-linux-deb
          path: avro-linux_*.deb

