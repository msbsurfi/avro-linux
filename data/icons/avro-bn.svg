<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="40%" stop-color="#1565c0"/>
      <stop offset="100%" stop-color="#0d47a1"/>
    </linearGradient>
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Squircle with Shadow -->
  <rect x="16" y="16" width="224" height="224" rx="48" ry="48" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Subtle Amber Border -->
  <rect x="16" y="16" width="224" height="224" rx="48" ry="48" fill="none" stroke="#ffe082" stroke-width="4.5" stroke-opacity="0.85"/>

  <!-- Top Gloss Highlight -->
  <path d="M 20 64 C 20 39.7 39.7 20 64 20 L 192 20 C 216.3 20 236 39.7 236 64 L 236 120 C 150 145 106 145 20 120 Z" fill="url(#glossGrad)"/>

  <!-- BN Text -->
  <text x="128" y="128" font-family="Noto Sans, sans-serif" font-size="96" font-weight="900" fill="#ffffff" text-anchor="middle" dominant-baseline="central">BN</text>

  <!-- Bengali Subtext -->
  <text x="128" y="198" font-family="Noto Sans Bengali, Kalpurush, sans-serif" font-size="62" font-weight="bold" fill="#ffca28" text-anchor="middle" dominant-baseline="central">বাং</text>
</svg>
