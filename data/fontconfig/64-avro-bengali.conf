<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
    Avro Linux: render Bangla with fonts that draw the matra (headline) correctly.
    SPDX-License-Identifier: MPL-2.0

    Debian and Ubuntu pick "Lohit Bengali" (sans-serif) and "Mukti" (serif)
    for Bengali text. Both break the headline over letters such as আ and ম,
    so words like আমাদের look wrong in browsers and editors.

    This file runs after 60-latin.conf and before 65-nonlatin.conf and
    66-lohit-bengali.conf, so the Noto Bengali fonts are placed right after
    the Latin defaults: Latin text keeps its usual font, while Bangla
    characters (and lang=bn text) now use Noto instead of Lohit/Mukti.
-->
<fontconfig>
  <!-- Text tagged as Bangla. 65-0-fonts-beng-extra.conf adds Lohit/Mukti with
       a strong binding, so these must be strong too to take precedence. -->
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>bn</string>
    </test>
    <test qual="any" name="family">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend" binding="same">
      <string>Noto Sans Bengali</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>bn</string>
    </test>
    <test qual="any" name="family">
      <string>serif</string>
    </test>
    <edit name="family" mode="prepend" binding="same">
      <string>Noto Serif Bengali</string>
    </edit>
  </match>

  <!-- Bangla characters inside text of any other language (fallback) -->

  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans Bengali</family>
    </prefer>
  </alias>
  <alias>
    <family>system-ui</family>
    <prefer>
      <family>Noto Sans Bengali</family>
    </prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif Bengali</family>
      <family>Noto Sans Bengali</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Noto Sans Bengali</family>
    </prefer>
  </alias>
</fontconfig>
